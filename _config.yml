# Site Build Settings

# Site metadata (critical for SEO)
url:                 'https://takeshimg92.github.io'
baseurl:             ''
title:               'Alessandro Morita'
description:         'Enjoying the thermodynamic limit'
author:
  name:              'Alessandro Morita'
  email:             'takeshi.gagliardi@gmail.com'
lang:                'en'

# Default image for social sharing (Open Graph / Twitter cards)
logo:                '/assets/img/sake.jpg'

# jekyll-paginate configuration
paginate:            5

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:categories/:title/
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Alessandro Morita"

# Giscus comments (powered by GitHub Discussions)
giscus:
  repo: 'takeshimg92/takeshimg92.github.io'
  repo_id: 'R_kgDOIBR1Uw'
  category: 'Announcements'
  category_id: 'DIC_kwDOIBR1U84C4WnK'

# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
